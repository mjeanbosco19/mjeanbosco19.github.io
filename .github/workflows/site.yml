name: Site

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild so the status board's "checked on" date stays current.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Check the live systems shown on the status board
        run: pnpm status
      - run: pnpm build
      - name: End-to-end and accessibility tests (WCAG 2.1 AA)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Lighthouse budgets
        run: pnpm dlx @lhci/cli@0.15.x autorun
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude 'linkedin\.com' --root-dir "$PWD/out" 'out/**/*.html'
          fail: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
